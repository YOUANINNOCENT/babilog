# Déploiement automatique du site + de l'API sur alwaysdata à chaque push sur main.
# GitHub construit le site (Flutter Web) et le serveur Dart (Linux), l'envoie par SSH, puis redémarre le serveur.
# Secret requis (Settings → Secrets and variables → Actions) : ALWAYSDATA_SSH_KEY = clé privée SSH de déploiement.
name: Déployer sur alwaysdata

on:
  push:
    branches: [main]
    paths:
      - "babilogi/**"
      - "serveur/**"
      - "deploiement/alwaysdata/**"
      - ".github/workflows/deployer-alwaysdata.yml"
  workflow_dispatch: {}          # bouton « Run workflow » pour relancer à la main

concurrency:
  group: alwaysdata
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"   # même version que sur le Mac
          channel: stable
          cache: true

      - name: Construire le site et le serveur
        run: sh deploiement/alwaysdata/preparer.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Construire l'application Android (téléchargeable sur /babilogis.apk)
        run: |
          cd babilogi
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=API_URL=https://youan.alwaysdata.net/api
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../deploiement/alwaysdata/envoi/site/babilogis.apk

      - name: Préparer la connexion SSH
        env:
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh-youan.alwaysdata.net >> ~/.ssh/known_hosts

      - name: Envoyer sur alwaysdata
        run: rsync -az --delete deploiement/alwaysdata/envoi/ youan@ssh-youan.alwaysdata.net:babilogis/

      - name: Redémarrer le serveur
        run: |
          # alwaysdata relance automatiquement le programme à la requête suivante
          # Le serveur s'arrête aussi tout seul dès qu'il voit que son programme a été remplacé (15 s).
          ssh youan@ssh-youan.alwaysdata.net 'pkill -u youan -f "[b]abilogis/serveur" || true' || true
          # On attend que la NOUVELLE version réponde (champ « version » = commit déployé).
          for i in $(seq 1 30); do
            sleep 10
            REPONSE=$(curl -fsS https://youan.alwaysdata.net/api/sante || true)
            echo "$REPONSE"
            if echo "$REPONSE" | grep -q "\"version\":\"$GITHUB_SHA\""; then
              echo "✓ BabiLogis est à jour : https://youan.alwaysdata.net"
              exit 0
            fi
          done
          echo "✗ Le serveur en ligne n'a pas redémarré sur la nouvelle version."
          exit 1

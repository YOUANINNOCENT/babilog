<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Location à Abidjan : chaque annonce est comparée aux loyers du quartier.">
  <meta name="theme-color" content="#FFFFFF">
  <title>BabiLogis — Le bon logement, au juste prix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    body { margin: 0; background: #F9F9F9; font-family: system-ui, sans-serif; }
    #chargement { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; color: #0F0F0F; font-weight: 700; font-size: 20px; }
    #chargement img { width: 36px; height: 36px; display: block; }
  </style>
</head>
<body>
  <div id="chargement"><img src="icons/Icon-192.png" alt="">BabiLogis</div>
  <script>
    // Retire l'écran de chargement dès que Flutter affiche la première image.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('chargement');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
